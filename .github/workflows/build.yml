name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Install KDE Neon repository
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates wget gnupg
          wget -qO /etc/apt/trusted.gpg.d/neon.asc https://archive.neon.kde.org/public.key
          echo "deb https://archive.neon.kde.org/user noble main" > /etc/apt/sources.list.d/neon.list
          apt-get update

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential clang cmake extra-cmake-modules pkgconf dbus-daemon \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev qt6-tools-dev \
            libkf6archive-dev libkf6config-dev libkf6coreaddons-dev \
            libkf6crash-dev libkf6dbusaddons-dev libkf6declarative-dev \
            libkf6globalaccel-dev libkf6guiaddons-dev libkf6i18n-dev \
            libkf6iconthemes-dev libkf6kio-dev libkf6itemmodels-dev \
            libkf6newstuff-dev libkf6notifications-dev libkf6package-dev \
            libkf6windowsystem-dev libkf6xmlgui-dev kf6-ksvg-dev \
            libplasma-dev libkpipewire-dev libkf6wayland-dev \
            plasma-activities-dev plasma-activities-stats-dev \
            plasma-workspace-dev plasma-wayland-protocols \
            libwayland-dev liblayershellqtinterface-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Build autotests
        run: cmake --build build --target latte-autotests --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Type-resolution lint over the freshly built modules: fails on QML
      # errors and on broken/missing generated latte QML modules. Legacy
      # warnings are summarized into build/qmllint-deep.log.
      - name: Deep QML lint
        run: ./scripts/qmllint-deep.sh build

  qml-lint:
    name: QML lint (qmllint)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install qmllint
        run: |
          apt-get update
          apt-get install -y --no-install-recommends qt6-declarative-dev qt6-declarative-dev-tools

      - uses: actions/checkout@v4

      # Syntax-error gate over every tracked QML file (scripts/qmllint.sh
      # disables all analyzer warnings; only errors fail the run).
      - name: Lint QML sources
        run: ./scripts/qmllint.sh

  install-verify:
    name: Install verify (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            dockerfile: Dockerfile.arch
            verifier: verify-install.sh
          - distro: fedora
            dockerfile: Dockerfile.fedora
            verifier: verify-install.sh
          - distro: opensuse
            dockerfile: Dockerfile.opensuse
            verifier: verify-install.sh
          - distro: ubuntu
            dockerfile: Dockerfile.ubuntu
            verifier: verify-install.sh
          - distro: mageia
            dockerfile: Dockerfile.mageia
            verifier: verify-install.sh
          - distro: debian13
            dockerfile: Dockerfile.debian
            verifier: verify-install.sh
            build_args: DEBIAN_BASE=trixie
          - distro: debian-stable
            dockerfile: Dockerfile.debian
            verifier: verify-install.sh
            build_args: DEBIAN_BASE=stable
          - distro: debian-sid
            dockerfile: Dockerfile.debian-sid
            verifier: verify-install.sh
          - distro: gentoo
            dockerfile: Dockerfile.gentoo
            verifier: verify-ebuild-gentoo.sh
          - distro: nixos
            dockerfile: Dockerfile.nixos
            verifier: verify-nix-nixos.sh

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.distro }} verification image
        run: |
          build_args=()
          if [ -n "${{ matrix.build_args }}" ]; then
            build_args+=(--build-arg "${{ matrix.build_args }}")
          fi
          docker build --file docker/${{ matrix.dockerfile }} \
            --build-arg USE_MIRRORS=false \
            "${build_args[@]}" \
            --tag latte-verify-${{ matrix.distro }} docker

      - name: Verify build and installation
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/src:ro" \
            --tmpfs /build:exec \
            --workdir /build \
            latte-verify-${{ matrix.distro }} \
            bash /src/docker/${{ matrix.verifier }} "${{ matrix.distro }}"

  package-install-verify:
    name: Package install verify (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            dockerfile: Dockerfile.arch
            format: arch
          - distro: fedora
            dockerfile: Dockerfile.fedora
            format: rpm
          - distro: opensuse
            dockerfile: Dockerfile.opensuse
            format: rpm
          - distro: mageia
            dockerfile: Dockerfile.mageia
            format: rpm
          - distro: debian13
            dockerfile: Dockerfile.debian
            build_args: DEBIAN_BASE=trixie
            format: deb
          - distro: debian-stable
            dockerfile: Dockerfile.debian
            build_args: DEBIAN_BASE=stable
            format: deb
          - distro: debian-sid
            dockerfile: Dockerfile.debian-sid
            format: deb
          - distro: ubuntu
            dockerfile: Dockerfile.ubuntu
            format: deb

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.distro }} packaging image
        run: |
          build_args=()
          if [ -n "${{ matrix.build_args }}" ]; then
            build_args+=(--build-arg "${{ matrix.build_args }}")
          fi
          docker build --file docker/${{ matrix.dockerfile }} \
            --build-arg USE_MIRRORS=false \
            "${build_args[@]}" \
            --tag latte-package-${{ matrix.distro }} docker

      - name: Build and install native package
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/src:ro" \
            --tmpfs /build:exec \
            --workdir /build \
            latte-package-${{ matrix.distro }} \
            bash -c '
              set -euo pipefail
              VERSION=$(sed -n "s/^ *set(VERSION \\([^)]*\\)).*/\\1/p" /src/CMakeLists.txt | head -1)
              if [ "${{ matrix.format }}" = arch ]; then
                bash /src/docker/package-arch.sh "$VERSION" /build
                pacman -U --noconfirm /build/latte-dock-ng-*.pkg.tar.zst
              elif [ "${{ matrix.format }}" = rpm ]; then
                cmake /src -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DVERSION="$VERSION"
                cmake --build . --parallel "$(nproc)"
                cpack -G RPM
                if command -v dnf >/dev/null; then
                  dnf install -y --setopt=install_weak_deps=False ./latte-dock-ng-*.rpm
                else
                  zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm ./latte-dock-ng-*.rpm
                fi
              else
                cmake /src -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DVERSION="$VERSION"
                cmake --build . --parallel "$(nproc)"
                cpack -G DEB
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./latte-dock-ng_*.deb
              fi
              test -x /usr/bin/latte-dock-ng
              test -f /usr/share/applications/org.kde.latte-dock.desktop
              echo NATIVE_PACKAGE_INSTALL_OK
            '
